name: Update Internal Data

on:
  schedule:
    # 每月1号凌晨0点自动执行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 允许手动在页面上触发

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.

      - name: Run data update script
        run: Rscript data-raw/update_sysdata.R

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add R/sysdata.rda
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update internal data in sysdata.rda"
            git push
          fi